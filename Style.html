<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:16px;
  background:#f5f3ef;
  font-family:Arial,sans-serif;
  color:#2c2c2c;
}

.container{
  max-width:1450px;
  margin:auto;
}

/* HEADER */

.header{
  background:linear-gradient(135deg,#6f4e37,#8b5e3c);
  color:white;
  padding:18px 22px;
  border-radius:16px;
  margin-bottom:16px;
  box-shadow:0 3px 10px rgba(0,0,0,0.10);
}

.header h1{
  margin:0;
  font-size:24px;
}

.sub-title{
  margin-top:4px;
  font-size:12px;
  opacity:0.9;
}

/* FILTER */

.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:16px;
}

.filters input,
.filters select{
  padding:8px 10px;
  border:1px solid #ddd;
  border-radius:8px;
  background:white;
  min-width:150px;
  font-size:13px;
}

.filters button{
  padding:8px 14px;
  border:none;
  border-radius:8px;
  background:#6f4e37;
  color:white;
  font-weight:bold;
  cursor:pointer;
  font-size:13px;
}

/* TAB */

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:16px;
}

.tab-btn{
  border:none;
  padding:8px 14px;
  border-radius:8px;
  background:#e8e1d8;
  color:#5c4635;
  cursor:pointer;
  font-weight:bold;
  font-size:13px;
}

.tab-btn.active{
  background:#6f4e37;
  color:white;
}

/* KPI COMPACT */

.cards{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
  margin-bottom:16px;
}

.card{

  background:white;

  padding:14px 16px;

  border-radius:14px;

  box-shadow:0 2px 6px rgba(0,0,0,0.06);

  min-height:95px;

  display:flex;
  flex-direction:column;
  justify-content:space-between;
}



/* COLOR CARD */

.card.red-card{
  background:linear-gradient(135deg,#d9534f,#b52b27);
  color:white;
}

.card.green-card{
  background:linear-gradient(135deg,#5cb85c,#3d8b3d);
  color:white;
}

.card.orange-card{
  background:linear-gradient(135deg,#f0ad4e,#d58512);
  color:white;
}

.card.red-card h3,
.card.green-card h3,
.card.orange-card h3,

.card.red-card p,
.card.green-card p,
.card.orange-card p,

.card.red-card small,
.card.green-card small,
.card.orange-card small{
  color:white;
}

/* TEXT */

.card h3{
  margin:0;

  color:#777;

  font-size:13px;

  font-weight:600;
}

.card p{

  margin:10px 0;

  font-size:24px;

  font-weight:bold;

  color:#222;

  line-height:1.2;
}

.card small{

  color:#888;

  font-size:12px;
}



/* ALERT */

.alert-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
  margin-bottom:16px;
}

.alert-card{
  padding:14px;
  border-radius:14px;
  color:white;
}

.alert-title{
  font-size:12px;
}

.alert-number{
  margin-top:8px;
  font-size:20px;
  font-weight:bold;
}

.red{
  background:linear-gradient(135deg,#d9534f,#b52b27);
}

.orange{
  background:linear-gradient(135deg,#f0ad4e,#d58512);
}

.green{
  background:linear-gradient(135deg,#5cb85c,#3d8b3d);
}

/* TABLE */

.table-card,
.chart-card{
  background:white;
  padding:16px;
  border-radius:14px;
  margin-bottom:16px;
  overflow-x:auto;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.table-card h3,
.chart-card h3{
  margin-top:0;
  margin-bottom:12px;
  color:#4b382a;
  font-size:16px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
}

table th{
  background:#f3eee7;
  padding:10px;
  text-align:left;
  color:#5a4637;
  font-size:12px;
}

table td{
  padding:10px;
  border-top:1px solid #eee;
  font-size:12px;
}

table tr:hover{
  background:#faf7f2;
}

/* STATUS */

.status-paid{
  color:#2e7d32;
  font-weight:bold;
}

.status-partial{
  color:#ef6c00;
  font-weight:bold;
}

.status-unpaid{
  color:#c62828;
  font-weight:bold;
}

/* INSIGHT */

.insight-card{
  background:#faf7f2;
  border-left:4px solid #6f4e37;
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
}

.insight-title{
  font-weight:bold;
  margin-bottom:5px;
  font-size:13px;
}

canvas{
  max-height:300px;
}

/* MOBILE */

@media(max-width:768px){

  body{
    padding:10px;
  }

  .filters{
    flex-direction:column;
  }

  .filters input,
  .filters select,
  .filters button{
    width:100%;
  }

  .cards{
  grid-template-columns:1fr;
  }

  .card p{
    font-size:16px;
  }

  .header h1{
    font-size:20px;
  }

}


/* ========================================
   LOADING
======================================== */

.loading-overlay{

  position:fixed;

  top:0;
  left:0;

  width:100%;
  height:100%;

  background:rgba(255,255,255,0.7);

  display:none;

  justify-content:center;
  align-items:center;

  z-index:9999;

}

.loading-box{

  background:#fff;

  padding:30px;

  border-radius:16px;

  box-shadow:0 4px 20px rgba(0,0,0,0.1);

  text-align:center;

}

.spinner{

  width:50px;
  height:50px;

  border:5px solid #eee;

  border-top:5px solid #4285f4;

  border-radius:50%;

  animation:spin 1s linear infinite;

  margin:auto;

}

.loading-text{

  margin-top:15px;

  font-weight:600;

}

@keyframes spin{

  100%{
    transform:rotate(360deg);
  }

}

</style>
